# brace-expansion ReDoS (CVSS 7.7). Same dev-only exposure as GHSA-mh99 above:
# the flagged brace-expansion 1.1.15 is pulled ONLY through the ESLint lint
# toolchain via minimatch@3.1.5. This advisory is genuinely fixed in the 1.x line
# by 1.1.16, BUT bumping 1.x 1.1.15 -> 1.1.16 would re-introduce the dev-only
# brace-expansion into the central dependency-review DIFF, where the over-broad
# GHSA-mh99 flat range ("<= 5.0.7", which still covers 1.1.16) would re-flag it and
# turn the now-green central dependency-review gate red again. The 1.x line is
# therefore intentionally pinned base-exact (1.1.15) so the unchanged dev-only dep
# is not re-evaluated, and both dev-only advisories on it are ignored here with a
# re-evaluation date. Production runtime (@argos/web via Next.js) does not ship the
# lint toolchain; the prod-reachable 5.x line is pinned to the fixed 5.0.8. Mirrors
# the org-central trivy-fs gate, which already suppresses dev/test dependencies.
reason = "brace-expansion 1.1.15 reachable only via dev-only ESLint toolchain (minimatch@3.1.5); the 1.1.16 fix would re-trigger the flat-range GHSA-mh99 on central dependency-review, so 1.x is pinned base-exact and both dev-only advisories are ignored."

